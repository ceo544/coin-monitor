name: Daily CSV Data Export

# 매일 자동으로 "새로 쌓인 데이터만" Railway 서버에서 받아와서
# data/coin_observations_partNNN.csv 여러 개의 조각 파일에 나눠서 커밋합니다.
#
# 왜 조각 파일인가: 컬럼이 1,391개나 되는 구조라 하나의 파일에 전부 모으면
# 며칠치만 쌓여도 GitHub의 파일당 100MB 제한을 넘습니다 (실제로 749MB
# 나서 커밋이 거부된 적 있음). 그래서 5,000행마다 새 조각 파일을 시작해서
# 파일 하나가 대략 16MB 안팎을 넘지 않게 합니다 (컬럼이 더 늘어나도
# 충분한 여유가 있는 수치입니다).
#
# 준비물 (저장소 Settings → Secrets and variables → Actions → New repository secret):
#   COIN_MONITOR_URL   예: https://coin-monitor-production.up.railway.app
#   EXPORT_API_TOKEN   앱의 /settings 페이지 "자동 데이터 백업" 섹션에서 복사한 토큰
#
# 실제 로그인 비밀번호는 절대 여기 안 들어갑니다 - 이 용도로만 쓰는 별도
# 읽기전용 토큰입니다.

on:
  schedule:
    - cron: "0 15 * * *"  # 매일 UTC 15:00 = KST 00:00 (자정)
  workflow_dispatch: {}     # 필요하면 Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Check secrets are configured
        env:
          COIN_MONITOR_URL: ${{ secrets.COIN_MONITOR_URL }}
          EXPORT_API_TOKEN: ${{ secrets.EXPORT_API_TOKEN }}
        run: |
          if [ -z "${COIN_MONITOR_URL}" ] || [ -z "${EXPORT_API_TOKEN}" ]; then
            echo "COIN_MONITOR_URL / EXPORT_API_TOKEN secret이 설정 안 되어 있습니다. 저장소 Settings에서 등록해주세요."
            exit 1
          fi

      - name: Fetch new rows and append into size-bounded chunk files
        env:
          COIN_MONITOR_URL: ${{ secrets.COIN_MONITOR_URL }}
          EXPORT_API_TOKEN: ${{ secrets.EXPORT_API_TOKEN }}
        run: |
          python scripts/append_daily_csv.py --url "${COIN_MONITOR_URL}" --token "${EXPORT_API_TOKEN}" --data-dir data

      - name: Commit and push if anything changed
        run: |
          set -euo pipefail
          echo "=== data 폴더 내용 ==="
          ls -la data/ || echo "(data 폴더가 없음)"
          echo "=== git status (add 전) ==="
          git status
          git config user.name "coin-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -v data/
          echo "=== git status (add 후) ==="
          git status
          echo "=== staged diff 요약 ==="
          git diff --staged --stat || true
          if git diff --staged --quiet; then
            echo "새 데이터 없음 - 커밋 스킵"
          else
            git commit -m "chore: daily data export $(date -u +%Y-%m-%d)"
            git push
            echo "=== push 후 최신 커밋 ==="
            git log -1 --oneline
          fi

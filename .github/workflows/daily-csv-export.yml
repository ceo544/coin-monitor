name: Daily CSV Data Export

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Check secrets are configured
        env:
          COIN_MONITOR_URL: ${{ secrets.COIN_MONITOR_URL }}
          EXPORT_API_TOKEN: ${{ secrets.EXPORT_API_TOKEN }}
        run: |
          if [ -z "${COIN_MONITOR_URL}" ] || [ -z "${EXPORT_API_TOKEN}" ]; then
            echo "COIN_MONITOR_URL / EXPORT_API_TOKEN secret이 설정 안 되어 있습니다. 저장소 Settings에서 등록해주세요."
            exit 1
          fi

      - name: Fetch new rows and append into size-bounded chunk files
        env:
          COIN_MONITOR_URL: ${{ secrets.COIN_MONITOR_URL }}
          EXPORT_API_TOKEN: ${{ secrets.EXPORT_API_TOKEN }}
        run: |
          python scripts/append_daily_csv.py --url "${COIN_MONITOR_URL}" --token "${EXPORT_API_TOKEN}" --data-dir data

      - name: Commit and push if anything changed
        run: |
          set -euo pipefail
          git config user.name "coin-monitor-bot"

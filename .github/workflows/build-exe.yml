name: Build Windows installer

# Runs on a clean GitHub-hosted Windows machine, so it never depends on
# anyone's local Python/PATH setup. Triggers when you push a version tag
# (e.g. `git tag v3.40.0 && git push origin v3.40.0`), or manually from the
# Actions tab ("Run workflow").
"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # needed to create/attach files to a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app requirements + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build CoinMonitor.exe
        run: |
          pyinstaller --noconfirm --onefile --name CoinMonitor `
            --hidden-import=tzdata `
            --collect-data tzdata `
            --collect-all pywebview `
            main.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compute version from tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile the installer (CoinMonitorSetup.exe)
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer.iss

      - name: Upload build artifact (for workflow_dispatch runs / debugging)
        uses: actions/upload-artifact@v4
        with:
          name: CoinMonitorSetup
          path: installer_output\CoinMonitorSetup.exe

      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output\CoinMonitorSetup.exe
          generate_release_notes: true
